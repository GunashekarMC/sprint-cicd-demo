name: Demo CI - Build and Test

on:
  push:
    branches: [main, 'demo/**']
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Choose a run to test Sprint (pass, fail, or slow/cancel)'
        required: true
        type: choice
        options: [pass, fail, slow]
        default: pass

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Slow scenario (to test cancellation)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'slow' }}
        run: |
          echo 'Waiting 120 seconds so cancellation can be tested.'
          sleep 120
      - name: Run tests
        run: npm test
      - name: Intentional CI failure (demo only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario == 'fail' }}
        run: |
          echo 'Intentional failure for Sprint error/log testing' >&2
          exit 1

  build:
    name: Build distributable and upload artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload built site artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-${{ github.run_number }}
          path: dist/
          retention-days: 7
