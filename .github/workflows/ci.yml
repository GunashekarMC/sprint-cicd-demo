
name: Sprint Staging Rejection Probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  protected-staging:
    name: Protected staging execution sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment: sprint-rejection-staging-20261106
    steps:
      - name: Must never execute during rejection test
        run: echo "SPRINT_REJECTION_PROBE_EXECUTED"
